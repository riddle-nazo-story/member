<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RIDDLE STORY チケットサイト</title>

  <link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />

  <link rel="stylesheet" href="style.css?v=20260805-1830" />
  <link rel="stylesheet" href="loading-creepy.css?v=fog-20260805-1842" />
</head>
<body>
  <div
    id="memberLoadingOverlay"
    class="member-loading-overlay"
    role="status"
    aria-live="polite"
    aria-hidden="false"
  >
    <div class="member-loading-fog member-loading-fog-1" aria-hidden="true"></div>
    <div class="member-loading-fog member-loading-fog-2" aria-hidden="true"></div>
    <div class="member-loading-fog member-loading-fog-3" aria-hidden="true"></div>

    <div class="member-loading-content">
      <p class="member-loading-brand">RIDDLE STORY TICKET</p>
      <p class="member-loading-label">SEARCHING THE ARCHIVE</p>

      <h1>公開された物語を探索しています</h1>

      <p id="memberLoadingText" class="member-loading-text">
        公演一覧を読み込んでいます……
      </p>

      <div class="member-loading-progress">
        <div class="member-loading-progress-meta">
          <span>LOADING</span>
          <span id="memberLoadingPercent">0%</span>
        </div>

        <div
          id="memberLoadingProgressTrack"
          class="member-loading-progress-track"
          role="progressbar"
          aria-label="読み込み状況"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span
            id="memberLoadingProgressBar"
            class="member-loading-progress-bar"
          ></span>
        </div>
      </div>
    </div>
  </div>

<header class="site-header">
    <div>
      <p class="eyebrow">RIDDLE STORY TICKET</p>
      <h1>チケットサイト</h1>
    </div>

    <div class="header-actions">
      <a href="index.html"><button class="ghost" type="button">会員サイトへ</button></a>
      <button id="logoutBtn" class="ghost hidden">ログアウト</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">RIDDLE STORY TICKET</p>
      <h2>TICKET</h2>
      <p>公演ごとのチケットページから、チケットの発行・購入手続きへ進めます。購入・発行にはログインが必要です。</p>
      <nav class="site-nav">
        <a href="index.html">MEMBER</a>
        <a href="#ticketSection">EVENT</a>
      </nav>
    </section>

    <section id="authNotice" class="card hidden">
      <h2>ログインが必要です</h2>
      <p class="muted">チケットサイトを利用するには、会員サイトでログインしてください。</p>
      <a href="index.html" class="game-link">会員サイトでログインする</a>
    </section>

    <section id="ticketSection" class="hidden">
      <div class="member-head card">
        <div>
          <p class="eyebrow">LOGIN</p>
          <h2 id="userName">---</h2>
          <p id="userEmail" class="muted">---</p>
        </div>
      </div>

      <h2>公開中の公演</h2>
      <div id="eventsList" class="grid"></div>
    </section>

    <div id="message" class="message hidden"></div>
  </main>

  <script src="loading.js?v=fog-20260805-1842"></script>
  <script src="ticket.js?v=fog-20260805-1842"></script>
</body>
</html>
